<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueueSmart - Admin Dashboard</title>
  <link rel="stylesheet" href="admin_dash.css">
</head>
<body>

  <header class="navbar">
    <div class="brand-group">
      <div class="nav-brand">QueueSmart</div>
      <span class="admin-label">Admin Dashboard</span>
    </div>
    <nav class="nav-menu" aria-label="Admin navigation">
      <button class="nav-btn active" id="nav-dash" type="button" data-page="dashboard" aria-current="page">Service Management</button>
      <button class="nav-btn" id="nav-queues" type="button" data-page="queues">Queue Management</button>
    </nav>
  </header>

  <main class="container">
    <section id="page-dashboard" aria-labelledby="services-title">
      <h1 id="services-title">Queue Management</h1>
      <h2 class="section-title">Current Queues</h2>
      <div id="admin-queue-list" class="service-list"></div>
    </section>

    <section id="page-queues" class="hide" aria-labelledby="queue-title">
      <div class="page-heading">
        <div>
          <h1 id="queue-title">Queue Management</h1>
        </div>
        <button class="button button-secondary" id="back-to-services" type="button">Back to services</button>
      </div>
      <div class="service-toolbar">
        <label class="service-picker" for="service-select">Service
          <select id="service-select">
            <option>Academic Advising</option>
            <option>Financial Aid</option>
            <option>IT Help Desk</option>
          </select>
        </label>
      </div>

      <div class="queue-overview" aria-live="polite">
        <div>
          <span class="stat-label">Waiting</span>
          <strong class="stat-value" id="total-people">0</strong>
        </div>
        <div>
          <span class="stat-label">Queue status</span>
          <strong class="stat-value" id="queue-status">Open</strong>
        </div>
        <div>
          <span class="stat-label">Flow</span>
          <strong class="stat-value" id="flow-status">Active</strong>
        </div>
      </div>

      <div class="queue-controls">
        <p id="queue-message" class="queue-message" aria-live="polite"></p>
        <div class="queue-actions">
          <button class="button button-secondary" id="toggle-arrivals" type="button">Close to arrivals</button>
          <button class="button button-secondary" id="toggle-flow" type="button" aria-pressed="false">Pause flow</button>
          <button class="button button-primary" id="call-next" type="button">Call next</button>
        </div>
      </div>

      <section id="now-serving" class="now-serving" aria-live="polite" hidden>
        <div>
          <span class="stat-label">Now serving</span>
          <strong id="serving-name"></strong>
        </div>
        <button class="button button-secondary" id="finish-service" type="button">Finish service</button>
      </section>

      <div class="table-heading">
        <h2>Customers in line</h2>
        <span id="queue-count-label" class="muted"></span>
      </div>
      <div class="queue-table-wrap">
        <table class="queue-table">
        <thead>
          <tr>
            <th scope="col">Pos</th>
            <th scope="col">Customer</th>
            <th scope="col">Appointment</th>
            <th scope="col">Est. wait</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody id="manage-queue-list"></tbody>
        </table>
      </div>
      <p id="dashboard-notice" class="dashboard-notice" aria-live="polite"></p>
    </section>

  </main>

  <div id="edit-time-modal" class="modal-bg hide" role="presentation">
    <form class="modal-box" id="wait-form" aria-labelledby="etm-title">
      <h2 id="etm-title">Update wait time</h2>
      <p>Customer: <strong id="etm-customer-name"></strong></p>
      <label class="input-group" for="new-wait-time">Estimated wait in minutes
        <input type="number" id="new-wait-time" min="0" max="600" required>
      </label>
      <div class="modal-buttons">
        <button class="button button-secondary" id="close-edit-modal" type="button">Cancel</button>
        <button class="button button-primary" type="submit">Update time</button>
      </div>
    </form>
  </div>

  <div id="cancel-modal" class="modal-bg hide" role="presentation">
    <section class="modal-box" aria-labelledby="cancel-title">
      <h2 id="cancel-title">Cancel appointment?</h2>
      <p>Remove <strong id="cancel-customer-name"></strong> from this queue?</p>
      <div class="modal-buttons">
        <button class="button button-secondary" id="close-cancel-modal" type="button">Keep appointment</button>
        <button class="button button-danger" id="confirm-cancel" type="button">Cancel appointment</button>
      </div>
    </section>
  </div>

  <script src="admin.js" defer></script>
</body>
</html>
